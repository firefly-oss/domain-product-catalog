openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Products
  description: CQ queries and registration for product catalog
paths:
  /api/v1/products:
    post:
      tags:
      - Products
      summary: Register product
      description: "Define product (purpose, currency, base rules)."
      operationId: registerProduct
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProductCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/products/{productId}/suspend:
    post:
      tags:
      - Products
      summary: Suspend product
      description: Temporarily suspend eligibility.
      operationId: suspendProduct
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/products/{productId}/simulate:
    post:
      tags:
      - Products
      summary: Simulate product
      description: Projects eligibility and pricing for the given product and customer
        profile. Reads existing product configurations; does not create any persistent
        artifacts.
      operationId: simulateProduct
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateProductRequest"
        required: true
      responses:
        "200":
          description: Simulation outcome with eligibility flag and pricing projection.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductSimulationResponse"
  /api/v1/products/{productId}/retire:
    post:
      tags:
      - Products
      summary: Retire product
      description: Retire product; existing accounts/loans remain.
      operationId: retireProduct
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/products/{productId}/retire-with-migration:
    post:
      tags:
      - Products
      summary: Retire with migration
      description: Retires the source product and records a migration pointer referencing
        an active target product for the grace period.
      operationId: retireWithMigration
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetireWithMigrationRequest"
        required: true
      responses:
        "200":
          description: Retirement accepted; source product is set to RETIRED and a
            MIGRATION_POINTER configuration is attached.
          content:
            '*/*':
              schema:
                type: object
  /api/v1/products/{productId}/resume:
    post:
      tags:
      - Products
      summary: Resume product
      description: Resume product eligibility.
      operationId: resumeProduct
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/products/{productId}/publish:
    post:
      tags:
      - Products
      summary: Publish product
      description: Publish a sellable version (freeze linked configs).
      operationId: publishProduct
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/products/{productId}/posting-rule-set:
    post:
      tags:
      - Products
      summary: Link posting rule set
      description: Link the GL mapping ruleset to the product.
      operationId: linkPostingRuleSet
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProductFeeStructureCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/products/{productId}/clone:
    post:
      tags:
      - Products
      summary: Clone product
      description: "Atomically duplicates a product into DRAFT status with a new code,\
        \ including configurations, localizations, relationships and documentation\
        \ requirements."
      operationId: cloneProduct
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneProductRequest"
        required: true
      responses:
        "200":
          description: Clone accepted; the saga result is emitted in the response
            body.
          content:
            '*/*':
              schema:
                type: object
  /api/v1/products/{productId}:
    get:
      tags:
      - Products
      summary: Get product info
      description: Retrieve product information by product ID.
      operationId: getProductInfo
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
  /api/v1/products/{productId}/versions:
    get:
      tags:
      - Products
      summary: List product versions
      description: Lists all versions of a product in the order returned by the core
        service.
      operationId: listVersions
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Array of version summaries.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductVersionSummary"
  /api/v1/products/{productId}/versions/compare:
    get:
      tags:
      - Products
      summary: Compare product versions
      description: Naive JSON-path diff between two versions of the same product;
        includes associated configurations.
      operationId: compareVersions
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: v1
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: v2
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Added / removed / changed field lists.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VersionComparisonResponse"
  /api/v1/products/catalog-tree:
    get:
      tags:
      - Products
      summary: Catalog tree
      description: Returns the full category hierarchy for a tenant with products
        attached at each level.
      operationId: getCatalogTree
      parameters:
      - name: tenantId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "Nested catalog tree with roots, subcategories and products."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogTreeResponse"
